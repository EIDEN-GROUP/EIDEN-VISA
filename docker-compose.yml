services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eidenvisa
      POSTGRES_PASSWORD: eidenvisa
      POSTGRES_DB: eidenvisa
    ports:
      # Bouclé sur localhost : la DB de dev n'est jamais exposée au réseau local.
      - "127.0.0.1:5435:5432"
    volumes:
      - eidenvisa_db:/var/lib/postgresql/data

volumes:
  eidenvisa_db:
